[metadata]
name = cpld-toolchain
version = attr: cpld_toolchain.__version__
description = Modular CPLD generation, build, simulation and programming tools
long_description = file: cpld_toolchain/README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    tomli>=2; python_version < "3.11"

[options.packages.find]
include =
    cpld_toolchain*
    xo2_library*
exclude =
    cpld_toolchain.cpld_vhdl_generator.tests*
    cpld_toolchain.toolchain.tests*
    cpld_toolchain.programmer_helper.tests*
    cpld_toolchain.tests*
    xo2_library.tests*

[options.package_data]
cpld_toolchain.cpld_vhdl_generator = contracts/*.toml, targets/*.lpf
cpld_toolchain.toolchain = targets/*/*, hdl/*, foss/*.json, foss/*.patch, foss/tests/*.cpp, analysis/*.txt, simulation/*.txt, venv-shell.bash
cpld_toolchain.programmer_helper = *.sh, *.toml
xo2_library = s3c/*.vhdl

[options.entry_points]
console_scripts =
    cpld-toolchain = cpld_toolchain.__main__:main
    cpld-vhdl-generator = cpld_toolchain.cpld_vhdl_generator.__main__:main
