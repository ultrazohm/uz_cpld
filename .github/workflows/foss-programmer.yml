name: FOSS programmer native Windows checks
on:
  push:
    paths:
      - 'cpld_toolchain/toolchain/foss/**'
      - '.github/workflows/foss-programmer.yml'
  pull_request:
    paths:
      - 'cpld_toolchain/toolchain/foss/**'
      - '.github/workflows/foss-programmer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-loader:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: patch
          pacboy: gcc:p cmake:p ninja:p pkgconf:p libftdi:p libusb:p zlib:p python:p
      - name: Verify pinned source and apply the FOSS patch
        run: |
          python - <<'PY'
          import runpy, pathlib, urllib.request, tarfile
          base = pathlib.Path('cpld_toolchain/toolchain/foss').resolve()
          flasher = runpy.run_path(str(base / 'flasher.py'))
          pin = flasher['pin']()
          work = pathlib.Path('native-loader-check')
          work.mkdir()
          archive = work / 'upstream.tar.gz'
          urllib.request.urlretrieve(pin['url'], archive)
          assert flasher['digest'](archive) == pin['sha256']
          with tarfile.open(archive) as source:
              source.extractall(work, filter='data')
          PY
          cd native-loader-check/openFPGALoader-1.1.1
          patch -p1 --batch --forward -i ../../cpld_toolchain/toolchain/foss/openfpgaloader-usercode.patch
      - name: Compile the native Windows loader and protocol tests
        run: |
          cmake -S native-loader-check/openFPGALoader-1.1.1 -B native-loader-check/build -G Ninja \
            -DENABLE_CABLE_ALL=OFF -DENABLE_FTDI_BASED_CABLE=ON \
            -DENABLE_VENDORS_ALL=OFF -DENABLE_LATTICE_SUPPORT=ON -DENABLE_UDEV=OFF
          cmake --build native-loader-check/build --parallel 2
          for test in usercode identity; do
            c++ -std=c++11 -I native-loader-check/openFPGALoader-1.1.1/src \
              cpld_toolchain/toolchain/foss/tests/$test.cpp -o native-loader-check/$test.exe
            native-loader-check/$test.exe
          done
      - name: Exercise the actual Windows executable without USB
        run: |
          python cpld_toolchain/toolchain/foss/tests/native.py native-loader-check/build/openFPGALoader.exe
          native-loader-check/build/openFPGALoader.exe --Version | grep -F v1.1.1-uz-programmer3
