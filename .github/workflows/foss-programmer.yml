name: FOSS programmer native Windows checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-loader:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: patch
          pacboy: gcc:p cmake:p ninja:p pkgconf:p libftdi:p libusb:p zlib:p python:p
      - name: Build and test the portable patched programmer
        run: python distribution/loader.py
      - uses: actions/upload-artifact@v4
        with:
          name: portable-loader-windows-x64
          path: build/portable-loader/
          if-no-files-found: error
          retention-days: 14
