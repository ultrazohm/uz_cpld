[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpld-toolchain"
dynamic = ["version"]
description = "Modular CPLD generation, build, simulation and programming tools"
readme = "cpld_toolchain/README.md"
requires-python = ">=3.10"
dependencies = ["tomli==2.2.1; python_version < '3.11'"]

[project.scripts]
uz_cpld = "cpld_toolchain.__main__:main"
cpld-toolchain = "cpld_toolchain.__main__:main"
cpld-vhdl-generator = "cpld_toolchain.cpld_vhdl_generator.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "cpld_toolchain.__version__"}

[dependency-groups]
docs = ["Sphinx==7.4.7", "furo==2025.12.19", "sphinxcontrib-mermaid==2.1.1"]
analysis = ["plotly==5.24.1", "pyvcd==0.5.0", "tenacity==9.1.4"]
simulation = ["cocotb==2.0.0", "pytest==8.4.2", "pytest-xdist==3.8.0", "execnet==2.1.1", "find_libpython==0.4.0", "exceptiongroup==1.3.0", "iniconfig==2.1.0", "packaging==25.0", "pluggy==1.6.0", "Pygments==2.19.2", "tomli==2.2.1", "typing_extensions==4.15.0"]
dev = [{include-group = "docs"}, {include-group = "analysis"}, {include-group = "simulation"}]
