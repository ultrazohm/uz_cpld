name: CPLD checks and documentation
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    concurrency:
      group: cpld-checks-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: new_approach
    steps:
      - uses: actions/checkout@v4
      - name: Build the license-free toolchain image
        id: image
        run: make sim-image
      - name: Run tooling tests
        run: docker run --rm --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD,target=/work" -w /work uz-cpld-toolchain make test
      - name: Build program documentation and run HDL simulations
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: docker run --rm --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD,target=/work" -w /work uz-cpld-toolchain make docs-local
      - name: Retain program diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program-diagnostics
          path: |
            new_approach/programs/*/build/simulation/
            new_approach/programs/*/build/netlist/
            new_approach/toolchain/build/simulation/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the documentation preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpld-documentation
          path: new_approach/docs/_build/html/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      - name: Upload the Pages site
        if: ${{ success() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: new_approach/docs/_build/html/

  deploy:
    needs: checks
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
