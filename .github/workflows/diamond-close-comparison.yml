name: Trace Diamond close and exit crashes
on:
  push:
    branches: [codex/diamond-diagnosis]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    env:
      DIAMOND_IMAGE: ${{ vars.DIAMOND_IMAGE || 'ghcr.io/schindlerto/lattice-diamond:3.14.0.75.2' }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to the existing private Diamond package
        env:
          GHCR_TOKEN: ${{ secrets.DIAMOND_GHCR_TOKEN }}
        run: |
          test -n "$GHCR_TOKEN"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u SchindlerTo --password-stdin
      - name: Build one image for both comparison arms
        run: |
          mkdir -p toolchain/build/diamond-close-comparison
          docker pull "$DIAMOND_IMAGE"
          diamond_base_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$DIAMOND_IMAGE")
          printf '%s\n' "$diamond_base_ref" > toolchain/build/diamond-close-comparison/base-image.log
          docker build --platform linux/amd64 --target toolchain \
            --build-arg "TOOLCHAIN_BASE=$diamond_base_ref" \
            -f .devcontainer/Dockerfile -t uz-cpld-close-comparison .
          docker image inspect --format '{{.Id}}' uz-cpld-close-comparison \
            > toolchain/build/diamond-close-comparison/image.log
          uname -a > toolchain/build/diamond-close-comparison/host.log
      - name: Enable core capture on this disposable runner
        run: |
          sysctl -n kernel.core_pattern > toolchain/build/diamond-close-comparison/original-core-pattern.log
          sudo sysctl -w 'kernel.core_pattern=core.%e.%p'
      - name: Compare 100 fresh preparations per arm without retries
        id: replay
        continue-on-error: true
        env:
          TRIAL: ${{ matrix.trial }}
        run: |
          # Reverse order on the middle runner to check for ordering effects.
          arms=(close no-close)
          if [ "$TRIAL" = 2 ]; then arms=(no-close close); fi
          for arm in "${arms[@]}"; do
            options=()
            if [ "$arm" = no-close ]; then options=(--no-close); fi
            status=0
            docker run --rm --init --platform linux/amd64 --ulimit core=-1 \
              --network=name=bridge,mac-address=10:91:d1:3d:14:ae \
              --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env LM_LICENSE_FILE=/opt/diamond/license/license.dat \
              --mount "type=bind,source=$PWD,target=/work" -w /work \
              uz-cpld-close-comparison python3 -m toolchain.diagnose_diamond replay \
                --program original/uz_d_voltage_013_tx30 --attempts 100 --mode traced \
                --output "toolchain/build/diamond-close-comparison/$arm" "${options[@]}" || status=$?
            printf '%s\n' "$status" > "toolchain/build/diamond-close-comparison/$arm-exit.log"
          done
      - name: Build the temporary debugger layer
        id: debugger
        if: ${{ !cancelled() && steps.replay.outcome != 'skipped' }}
        run: |
          docker build --build-arg TOOLCHAIN_IMAGE=uz-cpld-close-comparison \
            -f .devcontainer/Dockerfile.diamond-diagnostics -t uz-cpld-exit-debugger .
          docker image inspect --format '{{.Id}}' uz-cpld-exit-debugger \
            > toolchain/build/diamond-close-comparison/debugger-image.log
      - name: Analyze ordinary cores and trace no-close exits under GDB
        id: trace
        if: ${{ !cancelled() && steps.debugger.outcome == 'success' }}
        continue-on-error: true
        run: |
          run_debug() {
            docker run --rm --init --platform linux/amd64 --cap-add SYS_PTRACE --ulimit core=0 \
              --network=name=bridge,mac-address=10:91:d1:3d:14:ae \
              --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env LM_LICENSE_FILE=/opt/diamond/license/license.dat \
              --mount "type=bind,source=$PWD,target=/work" -w /work \
              uz-cpld-exit-debugger python3 -m toolchain.diagnose_diamond "$@"
          }
          status=0
          run_debug backtraces --output toolchain/build/diamond-close-comparison || status=1
          run_debug replay --program original/uz_d_voltage_013_tx30 --attempts 100 \
            --mode gdb --no-close --output toolchain/build/diamond-close-comparison/no-close-gdb || status=1
          exit "$status"
      - name: Restore runner core configuration
        if: always()
        run: |
          path=toolchain/build/diamond-close-comparison/original-core-pattern.log
          if [ -f "$path" ]; then
            sudo sysctl -w "kernel.core_pattern=$(cat "$path")"
          fi
      - name: Report native crash evidence
        if: always()
        env:
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
          TRACE_OUTCOME: ${{ steps.trace.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('toolchain/build/diamond-close-comparison')
          lines = ['| Preparation | Attempts | Segfaults | Results |', '|---|---:|---:|---|']
          failed = False
          for arm in ('close', 'no-close', 'no-close-gdb'):
              path = root / arm / 'summary.json'
              if path.exists():
                  report = json.loads(path.read_text())
                  lines.append(f'| {arm} | {report["attempts"]} | {report["segfaults"]} | {report["statuses"]} |')
                  failed |= report['attempts'] != 100 or report['statuses'].get('failed', 0) > 0
              else:
                  lines.append(f'| {arm} | Missing evidence | | |')
                  failed = True
          path = root / 'backtraces.json'
          if path.exists():
              report = json.loads(path.read_text())
              lines += ['', f'Ordinary-process cores analyzed: {report["cores"]}.']
              failed |= any(r['returncode'] != 0 for r in report['results'])
          else:
              failed = True
          lines += ['', 'Crashes intentionally keep this diagnostic red. Read native stacks in the artifact; no crashes means reproduction was inconclusive.']
          message = '\n'.join(lines) + '\n'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(message)
          failed |= any(os.environ[k] != 'success' for k in ('REPLAY_OUTCOME', 'TRACE_OUTCOME'))
          raise SystemExit(int(failed))
          PY
      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diamond-exit-traces-${{ matrix.trial }}
          path: |
            toolchain/build/diamond-close-comparison/
            !**/core
            !**/core.*
          retention-days: 14
