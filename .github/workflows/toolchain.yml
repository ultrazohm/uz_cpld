name: CPLD checks, firmware and documentation
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-foss:
    uses: ./.github/workflows/foss-programmer.yml

  standalone:
    name: Standalone CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: ubuntu-24.04-x64
            executable: uz_cpld
          # GitHub's x64 Windows runners use Server; the application targets Windows 11.
          - os: windows-2025
            platform: windows-x64
            executable: uz_cpld.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: distribution/requirements.txt
      - name: Install pinned packaging tools
        run: python -m pip install -r distribution/requirements.txt
      - name: Test standalone behavior
        run: python -m unittest cpld_toolchain.toolchain.tests.test_standalone -v
      - name: Build native CLI
        run: python distribution/build.py
      - name: Test the executable outside the checkout
        run: python distribution/smoke.py build/standalone/dist/uz_cpld/${{ matrix.executable }}
      - name: Archive the tested application
        run: python distribution/archive.py pack --application build/standalone/dist/uz_cpld --output build/standalone/assets
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.platform }}
          path: build/standalone/assets/*
          if-no-files-found: error
          retention-days: 14

  windows-python:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Bootstrap without Make or third-party Python packages
        run: python -S -m cpld_toolchain setup --dry-run 1
      - name: Create the native environment
        run: python -m cpld_toolchain setup --activate 0
      - name: Check Python tooling and native Windows locking
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          .venv\Scripts\python.exe -m cpld_toolchain test 2>&1 | Tee-Object -FilePath build/ci-tests.log
          exit $LASTEXITCODE
      - name: Summarize skipped tests and validation limits
        if: always()
        run: python cpld_toolchain/toolchain/ci_summary.py --test-log build/ci-tests.log
      - name: Verify the CLI and tracked generated programs
        run: |
          .venv\Scripts\python.exe -m cpld_toolchain check --program cvg_tx30 --release-cycle heartbeat_cvg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\python.exe -m cpld_toolchain build_all --dry-run 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\python.exe -m cpld_toolchain program --target dslot --dry-run 1

  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the license-free toolchain image
        id: image
        # The host has no Python dependencies; the image provides them.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          target: toolchain
          platforms: linux/amd64
          tags: uz-cpld-toolchain
          load: true
          cache-from: type=gha,scope=cpld-toolchain,version=2
          cache-to: type=gha,scope=cpld-toolchain,version=2,mode=max,ignore-error=true
      - name: Verify the shared Python and uv pins
        run: |
          docker run --rm -i --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD,target=/work" -w /work uz-cpld-toolchain python - <<'PYTHON'
          import json
          from pathlib import Path
          import subprocess
          import sys

          assert sys.prefix == "/opt/uz-cpld-env", sys.prefix
          assert sys.version.split()[0] == Path(".python-version").read_text().strip()
          version = json.loads(Path("cpld_toolchain/uv-bootstrap.json").read_text())["version"]
          assert subprocess.check_output(["uv", "--version"], text=True).split()[1] == version
          subprocess.run(["uz_cpld", "help", "--command", "setup"], check=True)
          subprocess.run(["uv", "run", "python", "-c", "import sys; assert sys.prefix == '/opt/uz-cpld-env'"], check=True)
          PYTHON
      - name: Run tooling tests
        shell: bash
        run: |
          mkdir -p build
          docker run --rm --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD,target=/work" -w /work uz-cpld-toolchain make test 2>&1 | tee build/ci-tests.log
      - name: Build original FOSS firmware
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: docker run --rm --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD,target=/work" -w /work uz-cpld-toolchain make build_all backend=foss release_cycle=original
      - name: Build and compare the heartbeat FOSS pilot
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD,target=/work" -w /work uz-cpld-toolchain make build program=cvg_tx30 release_cycle=heartbeat_cvg backend=foss
          docker run --rm --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD,target=/work" -w /work uz-cpld-toolchain make compare program=cvg_tx30 release_cycle=heartbeat_cvg backend=foss
      - name: Build program documentation and run HDL simulations
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: docker run --rm --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD,target=/work" -w /work uz-cpld-toolchain make docs release_cycle=all
      - name: Retain program diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program-diagnostics
          path: |
            build/ci-tests.log
            programs/usercodes.json
            build/analysis/
            build/foss/
            build/simulation/
            build/validation/
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize skipped tests and validation limits
        if: always()
        run: python3 cpld_toolchain/toolchain/ci_summary.py --backend foss --test-log build/ci-tests.log
      - name: Retain the documentation preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpld-documentation
          path: docs/_build/html/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      - name: Upload the Pages site
        if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html/

  diamond-build:
    name: Diamond firmware (all releases)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      # Override with a published tag or digest in repository Actions variables.
      DIAMOND_IMAGE: ${{ vars.DIAMOND_IMAGE || 'ghcr.io/schindlerto/lattice-diamond:3.14.0.75.2' }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to the private Diamond package
        env:
          # Classic PAT owned by SchindlerTo, with read:packages only.
          GHCR_TOKEN: ${{ secrets.DIAMOND_GHCR_TOKEN }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo 'Set the DIAMOND_GHCR_TOKEN repository secret to a classic PAT with read:packages.' >&2
            exit 1
          fi
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u SchindlerTo --password-stdin
      - uses: docker/setup-buildx-action@v4
      - name: Build the Diamond toolchain image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          target: diamond-ci
          platforms: linux/amd64
          tags: uz-cpld-toolchain-diamond
          load: true
          build-args: TOOLCHAIN_BASE=${{ env.DIAMOND_IMAGE }}
          # Reuse public Python stages; this target does not build/copy FOSS tools.
          # Never export private Diamond layers to the Actions cache.
          cache-from: type=gha,scope=cpld-toolchain,version=2
      - name: Disable ASLR for the Diamond build
        run: |
          sysctl -n kernel.randomize_va_space > "$RUNNER_TEMP/diamond-original-aslr"
          sudo sysctl -w kernel.randomize_va_space=0
          test "$(sysctl -n kernel.randomize_va_space)" = 0
      - name: Run local catalog builds for every release and archive firmware
        run: |
          docker run --rm --init --platform linux/amd64 \
            --network=name=bridge,mac-address=10:91:d1:3d:14:ae \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env LM_LICENSE_FILE=/opt/diamond/license/license.dat \
            --mount "type=bind,source=$PWD,target=/work" -w /work \
            uz-cpld-toolchain-diamond bash -e -c '
              check-diamond --synthesis
              python3 -m cpld_toolchain.toolchain.ci build_all
              python3 -m cpld_toolchain.toolchain.ci package --output build/uz-cpld-firmware.zip
            '
      - name: Restore runner ASLR
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/diamond-original-aslr" ]; then
            original_aslr=$(cat "$RUNNER_TEMP/diamond-original-aslr")
            sudo sysctl -w "kernel.randomize_va_space=$original_aslr"
            test "$(sysctl -n kernel.randomize_va_space)" = "$original_aslr"
          fi
      - name: Summarize Diamond validation limits
        if: always()
        run: python3 cpld_toolchain/toolchain/ci_summary.py --backend diamond
      - name: Retain Diamond firmware and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diamond-diagnostics
          path: |
            programs/usercodes.json
            build/diamond/
            build/validation/*/diamond-catalog/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain the verified firmware archive
        uses: actions/upload-artifact@v4
        with:
          name: diamond-firmware
          path: build/uz-cpld-firmware.zip
          if-no-files-found: error
          retention-days: 14

  publish-firmware:
    name: Publish testing firmware
    if: github.event_name == 'push'
    needs: [diamond-build, checks, windows-python, standalone, windows-foss]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: diamond-firmware
          path: firmware
      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: standalone-tools
          merge-multiple: true
      - name: Assemble tool-only, combined and firmware-only downloads
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python3 distribution/archive.py assemble --tools standalone-tools --firmware firmware/uz-cpld-firmware.zip --output release-assets --commit "$SOURCE_SHA"
      - name: Publish CLI and firmware as a testing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          tag="firmware-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          Path('release-notes.txt').write_text(
              'Standalone CLI and testing firmware from a push build.\n\n'
              f'Source commit: {os.environ["SOURCE_SHA"]}\n'
              f'Source ref: {os.environ["SOURCE_REF"]}\n\n'
              'Downloads: tool only or tool + firmware for Windows 11 x64 and Ubuntu 24.04 x64; '
              'firmware only is the platform-independent uz-cpld-firmware.zip. '
              'The application includes Python; install Diamond Programmer 3.14.0.75.2 and cable drivers separately. '
              'Configure it with uz_cpld programmer_path=PATH. See the included README.txt.\n\n'
              'The firmware ZIP contains Diamond .bit/.jed exports for all release catalogs and manifest.json '
              'with checksums, build provenance and the identity registry from this run.\n'
              'These builds do not establish hardware or board timing acceptance. '
              'ZIP programming uses the included identity registry. '
              'Windows executables are unsigned and tested on GitHub Windows Server runners.\n'
          )
          PYTHON
          gh release create "$tag" release-assets/* \
            --target "$SOURCE_SHA" --title "CPLD tools and testing firmware $tag" \
            --prerelease --latest=false --notes-file release-notes.txt

  deploy:
    needs: [checks, windows-python]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
