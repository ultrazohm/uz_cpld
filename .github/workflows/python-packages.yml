name: Python programmer wheels
on:
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        run: |
          version=$(python distribution/wheels.py version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: distribution/manylinux.Dockerfile
          tags: uz-cpld-wheel
          load: true
          cache-from: type=gha,scope=programmer-wheel
          cache-to: type=gha,scope=programmer-wheel,mode=max
      - name: Build and exercise the wheel on glibc 2.28
        run: |
          docker run --rm -v "$PWD:/work" uz-cpld-wheel bash -ec '
            git config --global --add safe.directory /work
            python distribution/loader.py
            python distribution/wheels.py user --platform manylinux_2_28_x86_64 --loader build/portable-loader --version "${{ needs.version.outputs.version }}"
            python -m venv /tmp/wheel-test
            /tmp/wheel-test/bin/python -m pip install build/wheels/*.whl
            python distribution/wheel_smoke.py --python /tmp/wheel-test/bin/python
          '
          sudo chown -R "$(id -u):$(id -g)" build
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
      - name: Test uv-managed Python and the GUI
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libx11-6 libxft2 libxext6 libxrender1
          uv venv --managed-python --python 3.12 build/wheel-test
          uv pip install --python build/wheel-test/bin/python build/wheels/*.whl
          xvfb-run -a build/wheel-test/bin/python distribution/wheel_smoke.py --python build/wheel-test/bin/python --gui
          UZ_CPLD_REQUIRE_GUI_TESTS=1 xvfb-run -a build/wheel-test/bin/python -m unittest cpld_toolchain.toolchain.tests.test_programmer_gui -v
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-linux
          path: build/wheels/*manylinux*.whl
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: portable-loader-windows-x64
          path: build/portable-loader
      - uses: actions/download-artifact@v4
        with:
          name: windows-drivers
          path: build/windows-drivers
      - run: python -m pip install build==1.3.0
      - run: python distribution/wheels.py user --platform win_amd64 --loader build/portable-loader --drivers build/windows-drivers --version '${{ needs.version.outputs.version }}'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
      - name: Test the installed wheel using uv-managed Python
        shell: pwsh
        run: |
          uv venv --managed-python --python 3.12 build/wheel-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = (Get-ChildItem build/wheels/*.whl).FullName
          uv pip install --python build/wheel-test/Scripts/python.exe $wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python distribution/wheel_smoke.py --python build/wheel-test/Scripts/python.exe --gui
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-windows
          path: build/wheels/*win_amd64.whl
          if-no-files-found: error
