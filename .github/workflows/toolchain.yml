name: CPLD checks, firmware and documentation
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Bootstrap without Make or third-party Python packages
        run: python -S -m toolchain venv --dry-run 1
      - name: Create the native environment
        run: python -m toolchain venv --activate 0
      - name: Check Python tooling and native Windows locking
        run: .venv\Scripts\python.exe -m toolchain test
      - name: Verify the CLI and tracked generated programs
        run: |
          .venv\Scripts\python.exe -m toolchain check --program cvg_tx30 --release-cycle heartbeat_cvg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\python.exe -m toolchain build-all --dry-run 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\python.exe -m toolchain program --target dslot --dry-run 1

  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the license-free toolchain image
        id: image
        run: make image
      - name: Run tooling tests
        run: docker run --rm --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD,target=/work" -w /work uz-cpld-toolchain make test
      - name: Build original FOSS firmware
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: docker run --rm --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD,target=/work" -w /work uz-cpld-toolchain make build-all backend=foss release_cycle=original
      - name: Build and compare the heartbeat FOSS pilot
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD,target=/work" -w /work uz-cpld-toolchain make build program=cvg_tx30 release_cycle=heartbeat_cvg backend=foss
          docker run --rm --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD,target=/work" -w /work uz-cpld-toolchain make compare program=cvg_tx30 release_cycle=heartbeat_cvg backend=foss
      - name: Build program documentation and run HDL simulations
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: docker run --rm --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD,target=/work" -w /work uz-cpld-toolchain make docs release_cycle=all
      - name: Retain program diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program-diagnostics
          path: |
            programs/usercodes.json
            programs/*/*/build/simulation/
            programs/*/*/build/netlist/
            programs/*/*/build/uz_dslot_xo2_foss/
            programs/*/*/build/uz_s3c_xo2_foss/
            programs/*/*/build/comparison/
            toolchain/build/simulation/
            toolchain/build/validation/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the documentation preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpld-documentation
          path: docs/_build/html/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      - name: Upload the Pages site
        if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html/

  diamond-build:
    name: Diamond firmware (all releases)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      # Override with a published tag or digest in repository Actions variables.
      DIAMOND_IMAGE: ${{ vars.DIAMOND_IMAGE || 'ghcr.io/schindlerto/lattice-diamond:3.14.0.75.2' }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to the private Diamond package
        env:
          # Classic PAT owned by SchindlerTo, with read:packages only.
          GHCR_TOKEN: ${{ secrets.DIAMOND_GHCR_TOKEN }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo 'Set the DIAMOND_GHCR_TOKEN repository secret to a classic PAT with read:packages.' >&2
            exit 1
          fi
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u SchindlerTo --password-stdin
      - name: Build the Diamond toolchain image
        run: |
          docker build --platform linux/amd64 --target toolchain \
            --build-arg "TOOLCHAIN_BASE=$DIAMOND_IMAGE" \
            -f .devcontainer/Dockerfile -t uz-cpld-toolchain-diamond .
      - name: Build every catalog program in every release
        run: |
          docker run --rm --init --platform linux/amd64 \
            --network=name=bridge,mac-address=10:91:d1:3d:14:ae \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env CPLD_DIAMOND_TRACE=1 \
            --env LM_LICENSE_FILE=/opt/diamond/license/license.dat \
            --mount "type=bind,source=$PWD,target=/work" -w /work \
            uz-cpld-toolchain-diamond bash -e -c '
              check-diamond --synthesis
              python3 -m toolchain.ci build-all
              python3 -m toolchain.ci package --output toolchain/build/publication/uz-cpld-firmware.zip
            '
      - name: Retain Diamond firmware and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diamond-diagnostics
          path: |
            programs/usercodes.json
            programs/*/*/build/uz_dslot_xo2_diamond/
            programs/*/*/build/uz_s3c_xo2_diamond/
            toolchain/build/validation/*/diamond-catalog/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain the verified firmware archive
        uses: actions/upload-artifact@v4
        with:
          name: diamond-firmware
          path: toolchain/build/publication/uz-cpld-firmware.zip
          if-no-files-found: error
          retention-days: 14

  publish-firmware:
    name: Publish testing firmware
    if: github.event_name == 'push'
    needs: [diamond-build, checks, windows-python]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: diamond-firmware
          path: firmware
      - name: Publish firmware ZIP as a testing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          tag="firmware-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          Path('release-notes.txt').write_text(
              'Testing firmware from a push build.\n\n'
              f'Source commit: {os.environ["SOURCE_SHA"]}\n'
              f'Source ref: {os.environ["SOURCE_REF"]}\n\n'
              'The ZIP contains Diamond .bit/.jed exports for all release catalogs and manifest.json '
              'with checksums, build provenance and the identity registry from this run.\n'
              'These builds do not establish hardware or board timing acceptance. '
              'Identity allocations remain local to this CI checkout; reconcile the included '
              'registry before using the managed programmer.\n'
          )
          PYTHON
          gh release create "$tag" firmware/uz-cpld-firmware.zip \
            --target "$SOURCE_SHA" --title "Testing firmware $tag" \
            --prerelease --latest=false --notes-file release-notes.txt

  deploy:
    needs: [checks, windows-python]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
