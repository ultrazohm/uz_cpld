# Created by make init_programmer. Edit these defaults for your hardware.
# Empty release uses programs/releases.toml; release_cycle=NAME overrides this field.
# Use make release_list and make list release_cycle=NAME to see available choices.
# Slot numbers are JTAG chain positions.
# S3C and D-slots require different UltraZohm physical states; program separately.
release = ""
# Backends are selected on the command line; both default to Diamond.
s3c = "s3c_power_on_debounce"

[slots]
"1" = "tx30"
"2" = "tx30"
"3" = "tx30"
"4" = "tx30"
"5" = "tx30"
